name: Feature request
description: Suggest an improvement for Codex Quota
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea. Describe the user problem before the proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who experiences it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Both platforms
        - macOS
        - Windows
        - Documentation or distribution
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context or mockups
