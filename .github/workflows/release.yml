name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build universal macOS release
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify tag matches application version
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AppResources/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $expected" >&2
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Build universal application bundle
        run: ./scripts/build-universal-app.sh

      - name: Verify and name release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          asset="Codex-Quota-macOS.zip"
          cp "dist/Codex Quota Universal.zip" "release-assets/$asset"
          (cd release-assets && shasum -a 256 "$asset" > "$asset.sha256")

      - name: Upload macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows ${{ matrix.arch }} release
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: arm64
            rid: win-arm64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content Windows/CodexQuota.Windows/CodexQuota.Windows.csproj
          $expected = "v$($project.Project.PropertyGroup.Version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match Windows project version $expected"
          }

      - name: Run core tests
        run: dotnet test Windows/CodexQuota.Core.Tests/CodexQuota.Core.Tests.csproj --configuration Release

      - name: Run Windows app-server integration tests
        run: dotnet test Windows/CodexQuota.Windows.Tests/CodexQuota.Windows.Tests.csproj --configuration Release

      - name: Publish self-contained single-file application
        shell: pwsh
        run: >-
          dotnet publish Windows/CodexQuota.Windows/CodexQuota.Windows.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/windows
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true
          -p:Deterministic=true

      - name: Package and checksum Windows assets
        shell: pwsh
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem artifacts/windows -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'CodexQuota.exe') {
            throw "Expected only CodexQuota.exe, found: $($files.Name -join ', ')"
          }

          New-Item -ItemType Directory -Force release-assets | Out-Null
          $baseName = "Codex-Quota-Windows-$env:RELEASE_ARCH"
          $exePath = "release-assets/$baseName.exe"
          $zipPath = "release-assets/$baseName.zip"
          Copy-Item artifacts/windows/CodexQuota.exe $exePath
          (Get-Item artifacts/windows/CodexQuota.exe).LastWriteTimeUtc = [datetime]'1980-01-01T00:00:00Z'
          Compress-Archive -Path artifacts/windows/CodexQuota.exe -DestinationPath $zipPath

          foreach ($path in @($exePath, $zipPath)) {
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $path
            "$hash  $name" | Set-Content -NoNewline -Encoding ascii "$path.sha256"
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - macos
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print
          (cd release-assets && sha256sum --check *.sha256)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --notes-file .github/release-preamble.md \
            --title "Codex Quota ${GITHUB_REF_NAME#v}"
